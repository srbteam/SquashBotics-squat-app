<style>/* ---------- Squat app v3: flat, editorial sports app ---------- */
:root{
  --bg:#FFFFFF; --band:#EFEFEC; --chrome:#E4E4E0; --surface:#FFFFFF; --surface-2:#F4F4F1; --sunken:#EBEBE7;
  --ink:#121314; --ink-2:#5A5E60; --ink-3:#8C9092; --line:rgba(18,19,20,.09); --line-2:rgba(18,19,20,.16);
  --brand:#D2302A;                       /* court-line red: the one brand colour */
  --court:#D2302A;
  --racket:#1E9E5A; --racket-soft:rgba(30,158,90,.12);
  --straight:#C8661A; --straight-soft:rgba(200,102,26,.12);
  --cross:#2F6BDB; --cross-soft:rgba(47,107,219,.11);
  --body:#8A8F91; --warn:#B7791F; --bad:#D2302A; --good:#1E9E5A;
  --glass:rgba(255,255,255,.86); --shadow:none; --cam-bg:#0B0C0C;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif-condensed,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0D0E; --band:#000000; --chrome:#000; --surface:#0D0D0E; --surface-2:#1A1A1C; --sunken:#202023;
  --ink:#F1F1EF; --ink-2:#A5A8A9; --ink-3:#727678; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --brand:#F0453C; --court:#E0473E; --racket:#2DB06C; --racket-soft:rgba(45,176,108,.15);
  --straight:#D9772F; --straight-soft:rgba(217,119,47,.16); --cross:#4F86EE; --cross-soft:rgba(79,134,238,.15);
  --body:#8E9395; --warn:#D49A3A; --bad:#F0453C; --good:#2DB06C; --glass:rgba(13,13,14,.86); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0D0E; --band:#000000; --chrome:#000; --surface:#0D0D0E; --surface-2:#1A1A1C; --sunken:#202023;
  --ink:#F1F1EF; --ink-2:#A5A8A9; --ink-3:#727678; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --brand:#F0453C; --court:#E0473E; --racket:#2DB06C; --racket-soft:rgba(45,176,108,.15);
  --straight:#D9772F; --straight-soft:rgba(217,119,47,.16); --cross:#4F86EE; --cross-soft:rgba(79,134,238,.15);
  --body:#8E9395; --warn:#D49A3A; --bad:#F0453C; --good:#2DB06C; --glass:rgba(13,13,14,.86); color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--chrome);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--chrome);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.app{box-shadow:0 0 0 1px var(--line)}}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum,.num{font-variant-numeric:tabular-nums}
.cond{font-family:var(--cond)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* ---------- header ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;height:48px;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:.5px solid var(--line-2)}
.wordmark{display:flex;align-items:center;gap:7px;font:700 21px/1 var(--cond);letter-spacing:1.4px;text-transform:uppercase}
.wordmark svg{flex:none}
.topbar .ctx{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;font:600 14px/1 var(--cond);letter-spacing:1px;text-transform:uppercase;color:var(--brand)}
.live i{width:8px;height:8px;border-radius:4px;background:var(--brand);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
.ptitle{padding-top:14px;padding-bottom:12px}
.ptitle h1{font:700 40px/0.95 var(--cond);text-transform:uppercase;letter-spacing:.3px}
.ptitle .sub{font-size:14px;color:var(--ink-2);margin-top:6px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px));
  background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border-top:.5px solid var(--line-2)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:500;color:var(--ink-3);padding:3px 0}
.tabbar a svg{width:25px;height:25px}
.tabbar a[aria-current="page"]{color:var(--ink)}
.tabbar a[aria-current="page"] svg{color:var(--brand)}

/* ---------- sections: flat blocks separated by bands ---------- */
.block{border-top:8px solid var(--band);padding-top:16px;padding-bottom:18px}
.block.tight{padding-bottom:6px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.bh h2{font:600 22px/1.05 var(--cond);text-transform:uppercase;letter-spacing:.4px}
.bh a,.bh button{font-size:14px;color:var(--brand);font-weight:500}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.foot{font-size:13px;color:var(--ink-3);line-height:1.4}
.hair{height:.5px;background:var(--line-2);margin:12px 0}

/* stat strip with vertical dividers */
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.stats>div{padding:2px 12px;border-left:.5px solid var(--line-2);min-width:0}
.stats>div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font:600 34px/1 var(--cond);letter-spacing:.2px;font-variant-numeric:tabular-nums}
.stats b small{font-size:17px;font-weight:500;color:var(--ink-2);margin-left:2px}
.stats span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.25}

/* key-value rows */
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-top:.5px solid var(--line-2)}
.kv>div:first-child{border-top:0;padding-top:2px}
.kv dt,.kv .k{color:var(--ink-2);font-size:15px;flex:none}
.kv dd,.kv .v{margin:0;font-size:15px;font-weight:600;text-align:right;min-width:0}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:52px;border-top:.5px solid var(--line-2)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t1{font-size:16px;font-weight:500}
.row .t2{font-size:13.5px;color:var(--ink-2);margin-top:1px}
.chev{width:7px;height:12px;color:var(--ink-3);flex:none}

/* underline tabs and segmented control */
.utabs{display:flex;gap:20px;border-bottom:.5px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.utabs::-webkit-scrollbar{display:none}
.utabs button{flex:none;padding:10px 0 9px;font-size:15px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-.5px;white-space:nowrap}
.utabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunken);border-radius:9px;padding:2px;gap:2px}
.seg button{height:32px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* direction text + swatches */
.dir-s{color:var(--straight)} .dir-x{color:var(--cross)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:0}
.sw.s{background:var(--straight)} .sw.x{background:var(--cross)} .sw.r{background:var(--racket)} .sw.b{background:var(--body)}
.tag{font:600 13px/1 var(--cond);letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:10px;background:var(--brand);color:#fff;
  font:600 19px/1 var(--cond);letter-spacing:1px;text-transform:uppercase;width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn:active,.seg button:active,.iconbtn:active{opacity:.7}

/* video */
.vid{position:relative;background:var(--cam-bg);aspect-ratio:1/1;width:100%;overflow:hidden}
.vid video{display:block;width:100%;height:100%;object-fit:cover}
.vtag{position:absolute;font:600 13px/1 var(--cond);letter-spacing:1px;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.5);padding:6px 8px 5px;border-radius:4px}
.vtag.tl{left:10px;top:10px}.vtag.tr{right:10px;top:10px}.vtag.bl{left:10px;bottom:10px;font-size:15px}.vtag.hit{background:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);padding-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:block;width:14px;height:3px;border-radius:2px}

/* tooltip */
.tip{position:absolute;pointer-events:none;z-index:15;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
svg text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- v4: friendlier layer (rounded tiles, softer type). The Lab overrides this back. ---------- */
:root{--round:"Rubik",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--tile:#F4F3EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tile:#1A1A1C}}
:root[data-theme="dark"]{--tile:#1A1A1C}
.ptitle h1{font:700 32px/1.05 var(--round);text-transform:none;letter-spacing:-.3px}
.ptitle .sub{font-size:15px}
.wordmark{font-family:var(--round);font-weight:700;font-size:19px;letter-spacing:.2px;text-transform:none}
.block{border-top:0;background:var(--tile);border-radius:22px;margin:12px max(12px,env(safe-area-inset-left,0px)) 0;
  padding:16px 16px 18px!important}
.block.plain{background:none;padding-left:4px!important;padding-right:4px!important}
.bh h2{font:600 19px/1.15 var(--round);text-transform:none;letter-spacing:-.1px}
.stats{gap:8px}
.stats>div{border-left:0;padding:12px 12px 11px!important;background:var(--surface);border-radius:16px}
.stats b{font:700 28px/1 var(--round);letter-spacing:-.4px}
.stats b small{font-size:15px}
.kv>div{border-top-color:var(--line)}
.vid{width:auto;margin:0 max(12px,env(safe-area-inset-left,0px));border-radius:22px}
.vtag{font:600 12px/1 var(--round);letter-spacing:.2px;text-transform:none;border-radius:999px;padding:7px 10px}
.vtag.bl{font-size:14px}
.btn{border-radius:999px;font:600 17px/1 var(--round);letter-spacing:0;text-transform:none}
.utabs{gap:8px;border-bottom:0}
.utabs button{padding:0 14px;height:34px;border-radius:999px;border:0;background:var(--surface);font-size:14.5px;color:var(--ink-2);margin:0}
.utabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tag{font:600 12px/1 var(--round);letter-spacing:.3px;text-transform:none}
.pillx,.pills{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:13.5px;font-weight:600}
.pillx{background:var(--cross-soft);color:var(--cross)} .pills{background:var(--straight-soft);color:var(--straight)}
.legend{padding-left:max(16px,env(safe-area-inset-left,0px))}
.tabbar a[aria-current="page"]{color:var(--brand)}

.live{font:600 13px/1 var(--round);letter-spacing:.2px;text-transform:none}
</style>

const ids = Object.keys(D.clips), v = $('#v'); let cur = 0;

  const s = D.sw[id], isx = s.label === 'crosscourt';

(function loop() { tick(); requestAnimationFrame(loop); })();
